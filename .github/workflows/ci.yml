name: Verify

on:
  push:
  pull_request:

jobs:
  quality:
    # The exhibition machine runs Windows, but collaborators develop on macOS
    # and Linux. Verifying all three is what actually keeps the build scripts
    # portable: a Windows-only matrix already let a `mkdir -p && cp` one-liner
    # reach main-bound branches undetected.
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report every platform's result rather than cancelling the rest on the
      # first failure, so a platform-specific break is obvious at a glance.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run test

      - name: Build production bundle
        run: npm run build

      - name: Run Chrome smoke test
        run: npm run test:e2e
